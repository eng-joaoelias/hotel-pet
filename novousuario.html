<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Novo Usuário</title>
  </head>
  <body>
    <div class="main">
      <div class="tela logado">
        <section class="navbar">
          <h1 class="logo">Hotel Pet</h1>
          <nav class="nav-menu">
            <a href="pets.html" class="opcao">
              <img src="img/pet.svg" alt="Icone Pet" />
              <span>Pets</span>
            </a>
            <a href="usuarios.html" class="opcao ativo">
              <img src="img/user.svg" alt="Icone Usuario" />
              <span>Usuários</span>
            </a>
            <a href="configuracoes.html" class="opcao">
              <img src="img/settings.svg" alt="Icone Configurações" />
              <span>Configurações</span>
            </a>
            <a href="revervas.html" class="opcao">
              <img src="img/book-open.svg" alt="Icone Reservas" />
              <span>Reservas</span>
            </a>
          </nav>
        </section>

        <section class="principal">
          <div class="user-header">
            <div class="user-info">
              <img src="img/user-circle.svg" alt="Foto do Perfil" />
              <span>João da Silva</span>
            </div>
          </div>

          <div class="conteudo-pagina">
            <div class="breadcrumb">Home / Usuários / Novo Usuário</div>

            <div class="wrapper-principal">
              <div class="header-pets">
                <h1>Novo Usuário</h1>
              </div>

              <div class="wrapper-form">
                <form action="" method="post">
                  <div class="grid-form">
                    <div
                      style="display: flex; flex-direction: column; gap: 1rem"
                    >

                      <div class="campo-input">
                        <label for="email">Email *</label>
                        <input type="email" id="email" name="email" required placeholder="mail@server.com" />
                      </div>

                      <div class="campo-input">
                        <label for="nome">Nome *</label>
                        <input type="text" id="nome" name="nome" required placeholder="Nome do Usuário" />
                      </div>

                      <div class="campo-input">
                        <label for="sobrenome">Sobrenome *</label>
                        <input type="text" id="sobrenome" name="sobrenome" required placeholder="Sobrenome do Usuário" />
                      </div>

                      <div class="campo-input">
                        <label for="telefone">Telefone *</label>
                        <input type="tel" id="telefone" name="telefone" required placeholder="(11) 91234-5678" />
                      </div>

                      <div class="campo-input">
                        <label for="funcao">Função *</label>
                        <select id="funcao" name="funcao" required>
                          <option value="" disabled></option>
                          <option value="funcionario">Funcionário</option>
                          <option value="cliente">Cliente</option>
                          <option value="gerente">Gerente</option>
                        </select>
                      </div>

                      <div
                    class="form-acoes"
                    style="justify-content: space-between; margin-top: 2rem; width: 100%;"
                  >
                    <button type="submit" class="btn-principal">
                      <span>💾</span> Salvar
                    </button>
                    <button type="reset" class="btn-secundario">
                      <span>🔄</span> Limpar
                    </button>
                  </div>
                    </div>

                    <div class="campo-input">
                      <label>Foto do Perfil</label>
                      <div
                        style="
                          width: 100%;
                          height: 100%;
                          min-height: 220px;
                          background: #fff;
                          border: 1px solid #b0b0b0;
                          border-radius: 4px;
                          position: relative;
                        "
                      >
                        <svg
                          width="100%"
                          height="100%"
                          style="position: absolute; top: 0; left: 0"
                        >
                          <line
                            x1="0"
                            y1="0"
                            x2="100%"
                            y2="100%"
                            stroke="#a0a0a0"
                            stroke-width="1.5"
                          />
                          <line
                            x1="100%"
                            y1="0"
                            x2="0"
                            y2="100%"
                            stroke="#a0a0a0"
                            stroke-width="1.5"
                          />
                        </svg>
                      </div>
                    </div>
                  </div>

                </form>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>
  </body>
</html>
