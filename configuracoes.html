<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Configurações</title>
  </head>
  <body>
    <div class="main">
      <div class="tela logado">
        <section class="navbar">
          <h1 class="logo">Hotel Pet</h1>
          <nav class="nav-menu">
            <a href="pets.html" class="opcao">
              <img src="img/pet.svg" alt="Icone Pet" />
              <span>Pets</span>
            </a>
            <a href="usuarios.html" class="opcao">
              <img src="img/user.svg" alt="Icone Usuario" />
              <span>Usuários</span>
            </a>
            <a href="#" class="opcao ativo">
              <img src="img/settings.svg" alt="Icone Configurações" />
              <span>Configurações</span>
            </a>
            <a href="reservas.html" class="opcao">
              <img src="img/book-open.svg" alt="Icone Reservas" />
              <span>Reservas</span>
            </a>
          </nav>
        </section>

        <section class="principal">
          <div class="user-header">
            <div class="user-info">
              <img src="img/user-circle.svg" alt="Foto do Perfil" />
              <span>João da Silva</span>
            </div>
          </div>

          <div class="conteudo-pagina">
            <div class="breadcrumb">Home / Configurações</div>

            <div class="wrapper-principal">
              <div class="header-pets">
                <h1>Configurações</h1>
              </div>

              <div class="wrapper-form">
                <form action="" method="post">
                  <div class="flex-form">
                    <div
                      style="
                        display: flex;
                        flex-direction: column;
                        gap: 1rem;
                        width: 100%;
                        max-width: 400px;
                      "
                    >
                      <div class="campo-input">
                        <label for="valor-diaria">Valor da Diária *</label>
                        <input
                          type="number"
                          id="valor-diaria"
                          name="valor-diaria"
                          placeholder="10.00"
                          min="0.01"
                          step="0.01"
                          required
                        />
                      </div>

                      <div class="campo-input">
                        <label for="nome">Vagas disponíveis *</label>
                        <input
                          type="number"
                          id="qtd-vagas"
                          name="qtd-vagas"
                          placeholder="3"
                          min="1"
                          step="1"
                          required
                        />
                      </div>

                      <div
                        class="form-acoes"
                        style="
                          justify-content: space-between;
                          margin-top: 2rem;
                          width: 100%;
                        "
                      >
                        <button type="submit" class="btn-principal">
                          <span>💾</span> Salvar
                        </button>
                        <button type="reset" class="btn-secundario">
                          <span>🔄</span> Limpar
                        </button>
                      </div>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>
  </body>
</html>
