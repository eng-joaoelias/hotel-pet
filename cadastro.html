<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Cadastro: Hotel Pet</title>
  </head>
  <body>
    <div class="main">
      <div class="tela">
        <section class="img-lateral"></section>

        <section class="form-login">
          <h1>Hotel Pet</h1>

          <form action="index.html" method="get">
            <div class="campo-input">
              <input
                type="text"
                name="user"
                id="user"
                required
                placeholder="Login"
              />
            </div>

            <div class="campo-input campo-senha">
              <input
                type="password"
                name="passw"
                id="passw"
                required
                placeholder="Senha"
              />
              <span class="icone-olho">&#128065;</span>
            </div>
            <button type="submit" class="btn-principal">Criar conta</button>
          </form>

          <div class="rodape-form">
            <a href="index.html" class="link-secundario">Já tem conta? Login</a>
          </div>
        </section>
      </div>
    </div>
  </body>
</html>
