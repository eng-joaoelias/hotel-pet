<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Login: Hotel Pet</title>
  </head>
  <body>
    <div class="main">
      <div class="tela">
        <section class="img-lateral"></section>
        <section class="form-login">
          <h1 class="logo">Hotel Pet</h1>
          <form action="pets.html" method="get">
            <div class="campo-input">
              <input type="text" required placeholder="Login" />
            </div>

            <div class="campo-input campo-senha">
              <input
                type="password"
                id="senha-input"
                required
                placeholder="Senha"
              />
              <span class="icone-olho">&#128065;</span>
            </div>

            <div class="opcoes">
              <div class="conectado-box">
                <input type="checkbox" name="conectado" id="conectado" />
                <label for="conectado">mantenha-me conectado</label>
              </div>
              <a href="">Esqueci a senha</a>
            </div>

            <button type="submit" class="btn-principal">
              <a href="pets.html">Enviar</a>
            </button>
          </form>

          <div class="divisor">
            <span>ou</span>
          </div>

          <section class="criar-conta">
            <div class="botoes-redes">
              <img src="img/facebook.svg" alt="Facebook" />
              <img src="img/twitter.svg" alt="Twitter" />
              <img src="img/google.svg" alt="Google" />
            </div>
            <a class="link-secundario" href="cadastro.html">Criar uma conta</a>
          </section>
        </section>
      </div>
    </div>
  </body>
</html>
